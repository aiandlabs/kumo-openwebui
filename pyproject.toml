[project]
name = "kumo"
version = "0.1.0"
description = "A small sales CRM for Japanese teams, with AI features on ai&"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "openai>=1.54",
    "openpyxl>=3.1",
    "pydantic>=2.9",
]

[project.scripts]
kumo = "kumo.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kumo"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
